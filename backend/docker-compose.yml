services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vyomflow
      POSTGRES_PASSWORD: vyomflow
      POSTGRES_DB: vyomflow_dev
    ports:
      - "5432:5432"
    volumes:
      - vyomflow_postgres_data:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vyomflow -d vyomflow_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vyomflow_postgres_data:
